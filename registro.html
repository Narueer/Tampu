<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - TAMPU</title>
    <link rel="icon" href="img/favicon.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <!-- menu -->
    <header>
        <div class="contenedor">
            <a href="index.html" class="logo">
                <img src="img/logo-160.png" alt="Logo de Tampu">
                TAMPU
            </a>
            <button id="btnMenu">☰</button>
            <nav id="menu">
            <a href="index.html">Inicio</a>
            <a href="habitaciones.html">Habitaciones</a>
            <a href="trabajos.html">Trabajos</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="login.html" class="activo">Iniciar sesión</a>
            </nav>
        </div>
    </header>

    <main class="contenedor">
        <form class="formulario" id="formRegistro">
            <h2>Crear cuenta</h2>

            <label for="tipo">Soy</label>
            <select id="tipo">
                <option>Estudiante</option>
                <option>Arrendador</option>
                <option>Empleador</option>
            </select>

            <label for="nombre">Nombres y apellidos</label>
            <input type="text" id="nombre">

            <label for="dni">DNI</label>
            <input type="text" id="dni" maxlength="8">

            <label for="email">Correo</label>
            <input type="email" id="email">

            <label for="clave">Contraseña</label>
            <input type="password" id="clave">

            <label for="clave2">Repetir contraseña</label>
            <input type="password" id="clave2">

            <p class="error" id="mensajeRegistro"></p>
            <button type="submit" class="btn">Crear cuenta</button>

            <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
        </form>
    </main>

    <!-- footer -->
    <footer>
        <p>
            <a href="index.html">Inicio</a>
            <a href="habitaciones.html">Habitaciones</a>
            <a href="trabajos.html">Trabajos</a>
            <a href="nosotros.html">Nosotros</a>
        </p>
        <p>© 2026 TAMPU - Proyecto del curso Programación Web - Universidad Continental</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
